# The code suite of the retrieval eval (docs/requirements.md, section 10).
#
# Four synthetic repositories in two workspaces, and questions about them in English and Russian,
# each with the places in the fixture files that answer it. Everything here is written by hand:
# the harbour, the lighthouse agent and the bakery do not exist.
#
#   repos/tidewater  workspace harbor  Python, English code and docs, one Russian doc
#   repos/beacon     workspace harbor  Go and TypeScript, English names, Russian comments and README
#   repos/zhernov    workspace mill    Python and TypeScript, Russian names, docstrings and docs
#   repos/polyglot   workspace mill    a small file in each of fifteen more languages (chunker 3)
#
# Run it (the role of MEMINI_DATABASE_URL needs CREATEDB; nothing in its database is touched):
#
#   memini eval --fake-embeddings --baseline eval/code/baseline-fake.json      # what CI runs
#   memini eval --modes all --json report.json                                 # the configured model
#
# The format is described in src/memini/evaluation/suite.py. In short: an expected result is a
# repository and a path, with a symbol (its lines, from the symbol table), a heading (the end of
# a heading trail) or lines; never a chunk id. The kind is what the expected results are (code,
# document or symbol); tags are free and the report groups by them too:
#
#   cross-language  the question is in one language, the text that answers it in the other
#   multi           more than one result is expected
#   filtered        the question carries a search filter
#
# Raise `version` when a question changes in meaning; the baselines record the suite's digest, so
# any change of a question or of a fixture file shows in a comparison.

format = 1
name = "code"
version = 1
description = "Code and Markdown of four synthetic repositories, questions in English and Russian"

[[repository]]
name = "tidewater"
workspace = "harbor"
path = "repos/tidewater"

[[repository]]
name = "beacon"
workspace = "harbor"
path = "repos/beacon"

[[repository]]
name = "zhernov"
workspace = "mill"
path = "repos/zhernov"

[[repository]]
name = "polyglot"
workspace = "mill"
path = "repos/polyglot"

