# --- Code, by pattern ----------------------------------------------------------------------------

[[question]]
id = "rx-night-defs"
text = '^def \w*night\w*\('
language = "en"
kind = "code"
modes = ["regex"]
tags = ["multi"]
expect = [
  { repository = "tidewater", path = "tidewater/fees.py", symbol = "is_night" },
  { repository = "tidewater", path = "tidewater/fees.py", symbol = "night_surcharge" },
  { repository = "tidewater", path = "tidewater/fees.py", symbol = "count_night_hours" },
]

[[question]]
id = "rx-severity"
text = 'Severity(Alarm|Warning)'
language = "en"
kind = "code"
modes = ["regex"]
tags = ["multi"]
expect = [
  { repository = "beacon", path = "internal/telemetry/battery.go", lines = [12, 16] },
  { repository = "beacon", path = "internal/telemetry/battery.go", symbol = "BatterySeverity" },
]

[[question]]
id = "rx-raise-f"
text = 'raise \w+\(f"'
language = "en"
kind = "code"
modes = ["regex"]
tags = ["multi", "filtered"]
filters = { repositories = ["zhernov"] }
expect = [
  { repository = "zhernov", path = "zhernov/ovens.py", symbol = "plan_batches" },
  { repository = "zhernov", path = "zhernov/sklad.py", symbol = "Склад.списать_муку" },
  { repository = "zhernov", path = "zhernov/starter.py", symbol = "starter_mass" },
]

[[question]]
id = "rx-export-alerts"
text = '^export function \w+Alerts\('
language = "en"
kind = "code"
modes = ["regex"]
tags = ["multi"]
expect = [
  { repository = "beacon", path = "web/src/alerts.ts", symbol = "sortAlerts" },
  { repository = "beacon", path = "web/src/alerts.ts", symbol = "dedupeAlerts" },
]

[[question]]
id = "rx-lamp-methods"
text = '^func \(l \*Lamp\) '
language = "en"
kind = "code"
modes = ["regex"]
tags = ["multi"]
expect = [
  { repository = "beacon", path = "internal/lamp/rotation.go", symbol = "Lamp.Turn" },
  { repository = "beacon", path = "internal/lamp/rotation.go", symbol = "Lamp.CheckRotation" },
]

