name: Desktop

# The desktop app (desktop/): its front end, its Rust side, and an unsigned build on the three
# platforms. docs/mcp is watched too: a test compares the app's client configuration with it. So
# are the launcher and its packaging recipe: the app carries the launcher, frozen, as a sidecar.
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "desktop/**"
      - "docs/mcp/**"
      - "scripts/memini-server.py"
      - "packaging/server/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-app.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "docs/mcp/**"
      - "scripts/memini-server.py"
      - "packaging/server/**"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:
    inputs:
      intel-mac:
        description: Build for Intel Macs too, as a release does.
        type: boolean
        default: false

# Read-only token. No job writes to the repository, and no job needs a secret: nothing is signed,
# notarized or published here.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version of Node the front end is checked with: the one desktop-app.yml builds the app
  # with. Update them together with desktop/README.md.
  NODE_VERSION: "24.22.0"

defaults:
  run:
    shell: bash
    working-directory: desktop

jobs:
  # Which parts a pull request touches. The front end runs on every run of this workflow; the app
  # matrix (three platforms, the slowest checks of a pull request) only when the pull request
  # changes what the app is built from: desktop/, the launcher, its packaging recipe or this
  # workflow. A change of docs/mcp alone needs the front end's test only. A job-level `if` rather
  # than a narrower `paths:` above, so that a skipped App job still reports, as skipped (which a
  # required check counts as passed). A push and a manual run build the app always. The diff is
  # git's, on the merge commit that a pull request checks out: its first parent is the base.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - name: Check out (the merge commit and its parents)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Changed paths
        id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != "pull_request" ]; then
            echo "app=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "${changed}"
          pattern='^(desktop/|scripts/memini-server\.py$|packaging/server/|\.github/workflows/desktop(-app)?\.yml$)'
          if printf '%s\n' "${changed}" | grep -Eq "${pattern}"; then
            echo "app=true" >> "${GITHUB_OUTPUT}"
          else
            echo "app=false" >> "${GITHUB_OUTPUT}"
            echo "No app files changed: the App jobs are skipped."
          fi

  frontend:
    name: Front end (types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The version of pnpm is the one package.json names in packageManager.
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the front end
        run: pnpm build

  # The app on each platform (desktop-app.yml, which release.yml calls too): the Rust side
  # linted and tested, the launcher frozen into the sidecar, and the bundles a release carries,
  # uploaded as the artifacts memini-desktop-<os>. Unsigned.
  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/desktop-app.yml
    with:
      intel-mac: ${{ inputs.intel-mac == true }}
    permissions:
      contents: read
