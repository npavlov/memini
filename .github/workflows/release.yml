name: Release
on:
  push:
    tags: ["v*"]

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: memini
          POSTGRES_PASSWORD: memini
          POSTGRES_DB: memini
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Test upgrade from the preceding release tag
        env:
          MEMINI_TEST_DATABASE_URL: postgresql://memini:memini@localhost:5432/memini
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            scripts/test-upgrade.sh "$previous"
          else
            echo 'First release tag; no previous release schema exists.'
          fi
      - name: Verify tag and build distributions
        run: |
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md
          uv lock --check
          uv build --out-dir dist
          uv venv "$RUNNER_TEMP/install"
          uv pip install --python "$RUNNER_TEMP/install/bin/python" dist/*.whl
          "$RUNNER_TEMP/install/bin/memini" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release-notes.md
            dist/

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The published image with the digest of its index, for the desktop app's launcher to pin.
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish multi-platform image with attestations
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --sbom=true \
            --provenance=mode=max --tag "$image" --push \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" .
          # The digest of the index just pushed, which the registry must report for the tag.
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' > "$RUNNER_TEMP/index.json"
          test "$(jq -r .digest "$RUNNER_TEMP/index.json")" = "$digest"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Published $image@$digest"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$image"
            # The service in the image is the Python package of this tag (X.Y.ZrcN).
            printed=$(docker run --rm --platform "$platform" --entrypoint memini "$image" --version)
            echo "$printed"
            release=${GITHUB_REF_NAME#v}
            [[ " $printed " == *" ${release/-rc./rc} "* ]]
            docker run --rm --platform "$platform" --entrypoint python "$image" \
              -c 'import onnxruntime, psycopg, tokenizers, tree_sitter'
          done

  quickstart:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the published image and search the quickstart fixtures
        run: scripts/test-release-install.sh "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" "$GITHUB_REF"

  # One version for everything the release ships (docs/releasing.md): the tag, the image, the
  # Python package, the app's bundles and the image each frozen launcher names. Nothing goes to
  # PyPI or the draft release unless they agree.
  versions:
    needs: [build, image, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: memini-desktop-*
          path: desktop-bundles
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: launcher-pin-*
          path: launcher-pins
          merge-multiple: true
      - name: One version everywhere
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          python3 scripts/check-release-versions.py "$GITHUB_REF_NAME" "$IMAGE" \
            release/dist desktop-bundles launcher-pins

  package:
    needs: [quickstart, versions]
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*

  notes:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--draft --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" --notes-file release-notes.md --title "$GITHUB_REF_NAME"

  # The desktop app, built from the tag on each platform (desktop-app.yml, which also checks the
  # app's version against the tag), without the Rust cache: a published bundle is built from
  # nothing restored. Its launcher pins the image the image job has just published, with its
  # digest, so that the app of this release installs this release's server; the freeze checks
  # that the frozen launcher names it. It runs beside the quickstart and the package; only the
  # upload waits for the draft release.
  desktop:
    needs: image
    uses: ./.github/workflows/desktop-app.yml
    with:
      tag: ${{ github.ref_name }}
      image: ${{ needs.image.outputs.image }}
      cache: false
      intel-mac: true
    permissions:
      contents: read

  attach-desktop:
    needs: [notes, versions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: memini-desktop-*
          path: dist-desktop
          merge-multiple: true
      - name: Checksums of the desktop app
        run: |
          (cd dist-desktop && sha256sum -- * > ../desktop-SHA256SUMS)
          mv desktop-SHA256SUMS dist-desktop/
          cat dist-desktop/desktop-SHA256SUMS
      - name: Attach the desktop app to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/attach-release-assets.sh "$GITHUB_REF_NAME" dist-desktop

  installers:
    needs: notes
    uses: ./.github/workflows/platform-installers.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  attach-installers:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-release
          path: dist-platform
      - name: Attach verified files to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/attach-release-assets.sh "$GITHUB_REF_NAME" dist-platform
