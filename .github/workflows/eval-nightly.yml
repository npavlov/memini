name: Isolated x86 kernel comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  latency:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        attempt: [1, 2]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Benchmark original and quality-passing candidate
        env:
          CORES: 4
        run: |
          set -eu
          image=ghcr.io/npavlov/memini@sha256:b31d29cd401776ab262c307f5da368122062fff6d464a0ebe9aef5504a8649da
          docker pull "$image"
          nproc
          lscpu
          docker run --rm --network none --cpus "$CORES" -v "$PWD/.bench:/bench:ro" --entrypoint python "$image" /bench/score.py | tee -a "$GITHUB_STEP_SUMMARY"
