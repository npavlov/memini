name: Linux x86 precision latency
on: workflow_dispatch
permissions:
  contents: read
jobs:
  latency:
    strategy:
      fail-fast: false
      matrix:
        cores: [2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Benchmark original and quality-passing candidate
        env:
          CORES: ${{ matrix.cores }}
        run: |
          set -eu
          image=ghcr.io/npavlov/memini@sha256:b31d29cd401776ab262c307f5da368122062fff6d464a0ebe9aef5504a8649da
          docker pull "$image"
          nproc
          lscpu
          lib=/opt/memini/venv/lib/python3.12/site-packages/memini/rerank
          for profile in before after; do
            flags=(-v "$PWD/.bench/$profile.py:$lib/local.py:ro" -v "$PWD/.bench/per-token.onnx.gz:$lib/qwen3-per-token-int8.onnx.gz:ro")
            docker run --rm --network none --cpus "$CORES" --cpuset-cpus "0-$((CORES-1))" -v "$PWD/.bench:/bench:ro" -v "$PWD/.bench/inputs.jsonl:/in.jsonl:ro" "${flags[@]}" --entrypoint python "$image" /bench/measure.py | tee "$profile.jsonl"
            echo "$profile $(tail -1 "$profile.jsonl")" >> "$GITHUB_STEP_SUMMARY"
          done
