name: Isolated x86 kernel comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  latency:
    strategy:
      fail-fast: false
      matrix:
        cores: [2, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Benchmark original and quality-passing candidate
        env:
          CORES: ${{ matrix.cores }}
        run: |
          set -eu
          image=ghcr.io/npavlov/memini@sha256:b31d29cd401776ab262c307f5da368122062fff6d464a0ebe9aef5504a8649da
          docker pull "$image"
          nproc
          lscpu
          for profile in per-token unsigned blockwise; do
            flags=()
            flags=(-e OVERRIDE_MODEL="$profile")
            docker run --rm --network none --cpus "$CORES" --cpuset-cpus "0-$((CORES-1))" -v "$PWD/.bench:/bench:ro" -v "$PWD/.bench/inputs.jsonl:/in.jsonl:ro" "${flags[@]}" --entrypoint python "$image" /bench/measure.py | tee "$profile.jsonl"
            echo "$profile $(tail -1 "$profile.jsonl")" >> "$GITHUB_STEP_SUMMARY"
          done
