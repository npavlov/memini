name: Isolated x86 kernel comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  latency:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
        attempt: [1, 2, 3]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Benchmark original and quality-passing candidate
        env:
          CORES: 4
        run: |
          set -eu
          image=ghcr.io/npavlov/memini@sha256:b31d29cd401776ab262c307f5da368122062fff6d464a0ebe9aef5504a8649da
          lscpu
          if grep -qw avx512_vnni /proc/cpuinfo; then echo "Legacy hardware required for this comparison"; exit 0; fi
          docker pull "$image"
          docker run --rm --network none --cpus 4 --cpuset-cpus 0-3 -v "$PWD/.bench:/bench:ro" --entrypoint python "$image" /bench/screen.py per-token channel7 split4b7 risk6 risk12 blockwise@2 blockwise@4
