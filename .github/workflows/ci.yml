name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. No job needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every `uv sync` and `uv run`, including those inside make targets, fails if uv.lock is stale
  # instead of rewriting it.
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No python-version: the interpreter comes from .python-version, as it does locally.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: lint

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: make lint

      - name: Type check (pyright)
        run: make typecheck

  # The secret scan: gitleaks, pinned and checked by SHA-256 in scripts/secret-scan.sh, with the
  # rules of .gitleaks.toml, over every commit reachable from the checked-out ref (for a pull
  # request, the merge commit: main and every commit of the branch). The whole history rather than
  # the diff, so a key that a later commit removes still fails the run. Then the proof that the
  # pre-commit hook of `make hooks` blocks a commit with a fake key, in a throwaway repository.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version and checksum)
        run: scripts/secret-scan.sh install

      - name: Scan every commit (make secret-scan)
        run: make secret-scan

      # No python-version: the interpreter comes from .python-version, as it does locally.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: secrets

      - name: Install dependencies
        run: uv sync --locked

      # In the test job these tests skip, as gitleaks is not installed there; here they must run.
      - name: The pre-commit hook blocks a fake key
        env:
          MEMINI_REQUIRE_GITLEAKS: "1"
        run: uv run pytest tests/test_secret_scan.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        # The image of compose.yaml, pinned by the same index digest; update both together.
        image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: memini
          POSTGRES_PASSWORD: memini
          POSTGRES_DB: memini
        ports:
          - 5432:5432
        # Check over TCP: the server that initdb starts first listens on the socket only, so the
        # check passes only once the final server accepts connections.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U memini -d memini"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # python-version exports UV_PYTHON, which uv treats as an explicit request (like --python);
      # it overrides the 3.12 pin in .python-version.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: test

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the Python version
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          actual="$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "Python ${actual}"
          if [ "${actual}" != "${EXPECTED}" ]; then
            echo "::error::Expected Python ${EXPECTED}, got ${actual}"
            exit 1
          fi

      - name: Unit tests
        run: make test

      - name: Integration tests
        env:
          MEMINI_TEST_DATABASE_URL: postgresql://memini:memini@localhost:5432/memini
        run: make test-integration

  # The small retrieval eval, on every pull request: lexical, exact, regex and symbol search on the
  # code suite with the FakeEmbedder, compared with eval/code/baseline-fake.json (make eval). A
  # change that lowers a recall or the MRR of a group by more than the margin (0.02) exits 4 and
  # fails this check; a change meant to move them writes the baseline again and commits it
  # (docs/requirements.md, section 10). Dense and hybrid search with the default model run
  # nightly (eval-nightly.yml). The decision eval joins this job with memini-f9a (M4).
  eval:
    name: Retrieval eval (fake embeddings)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # The image of compose.yaml, pinned by the same index digest; update both together.
        image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: memini
          POSTGRES_PASSWORD: memini
          POSTGRES_DB: memini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U memini -d memini"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No python-version: the interpreter comes from .python-version, as it does locally.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: eval

      - name: Install dependencies
        run: uv sync --locked

      # The eval creates a scratch database on this server and drops it afterwards; the role of
      # the service container is a superuser, so it has CREATEDB. Exit codes: 1 a search failed or
      # an expected result is not in the index, 2 an invalid suite or baseline, 3 no database,
      # 4 a regression; make reports any of them as its own exit code 2 ("Error 4").
      - name: Retrieval eval against the committed baseline (make eval)
        env:
          MEMINI_DATABASE_URL: postgresql://memini:memini@localhost:5432/memini
        run: make eval

  # The image and the supported install, end to end: a Dockerfile that does not build, or a service
  # that does not start, serve MCP or log JSON, fails the run. No secrets: the smoke test creates
  # its token in the stack and revokes it. No layer cache: a cold build takes a few minutes, while
  # the GitHub Actions cache for a compose build needs more actions and the runtime token exposed.
  smoke:
    name: Image and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the MCP client that the smoke test runs on the host; Python from .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: smoke

      - name: Install dependencies
        run: uv sync --locked

      - name: Docker and compose versions
        run: |
          docker version
          docker compose version

      # Builds the image, starts the database and the service (compose.yaml, default ports), waits
      # until both are healthy (at most 180 s), then checks them; see scripts/compose-smoke.sh.
      - name: Smoke test (make smoke)
        run: make smoke

      - name: Show the stack after a failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down
