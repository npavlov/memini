[project]
name = "memini"
version = "0.0.0"
description = "Self-hosted knowledge service: code, messages and meeting notes in; MCP and HTTP out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.164.0",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
]

[project.urls]
Repository = "https://github.com/npavlov/memini"

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx2>=2.16.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "S",   # bandit
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "integration: needs Postgres with pgvector (make db, or MEMINI_TEST_DATABASE_URL); make test-integration",
]
