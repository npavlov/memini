[project]
name = "memini"
version = "0.2.0rc2"
description = "Self-hosted knowledge service: code, messages and meeting notes in; MCP and HTTP out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.164.0",
    "httpx2>=2.16.2",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "tree-sitter>=0.26.1",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.24.0",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-elixir>=0.3.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-objc>=3.0.2",
    "tree-sitter-php>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-scala>=0.26.13",
    "tree-sitter-sql>=0.3.13",
    "tree-sitter-swift>=0.7.4",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
memini = "memini.cli:main"

[project.urls]
Repository = "https://github.com/npavlov/memini"

[project.optional-dependencies]
local-embeddings = [
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "tokenizers>=0.23.3",
]

[build-system]
# The range must contain the uv that builds: CI and the image pin 0.13.9, a local uv may be older.
# The upper bound is the next minor release, as uv's docs advise: uv_build may break in one.
requires = ["uv_build>=0.10.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx2>=2.16.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures", "eval"] # inputs for parsers and the eval, not code of this project

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "S",   # bandit
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.pyright]
include = ["src", "tests", "scripts", "integrations"]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "integration: needs Postgres with pgvector (make db, or MEMINI_TEST_DATABASE_URL); make test-integration",
    "git: runs the git executable (skipped where it is not installed); part of make test",
]
