<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Memini app icon">
  <title>Memini app icon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24408A"/>
      <stop offset="1" stop-color="#0E1936"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="192" x2="0" y2="832">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3DFF6"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#A9F6E7"/>
      <stop offset="1" stop-color="#33C2A8"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#040A1C" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Tile: full canvas, rounded. Set rx="0" for a full-bleed master. -->
  <rect id="tile-shape" x="0" y="0" width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#sheen)"/>
  <!-- One rounded line, 96 wide with gaps of 56 before the 1.288 scale; the mark keeps about 10 percent of the tile clear on each side, turning inward to the point: the source. -->
  <g filter="url(#shadow)" transform="matrix(1.288 0 0 1.288 -147.456 -147.456)">
    <path fill="url(#line)" d="M288 731 A40 40 0 0 1 248 771 H232 A40 40 0 0 1 192 731 V293 A101 101 0 0 1 293 192 H731 A101 101 0 0 1 832 293 V731 A101 101 0 0 1 731 832 H384 A40 40 0 0 1 344 792 V384 A40 40 0 0 1 384 344 H632 A48 48 0 0 1 632 440 H480 A40 40 0 0 0 440 480 V696 A40 40 0 0 0 480 736 H696 A40 40 0 0 0 736 696 V328 A40 40 0 0 0 696 288 H328 A40 40 0 0 0 288 328 Z"/>
    <circle cx="588" cy="588" r="60" fill="url(#dot)"/>
  </g>
</svg>
