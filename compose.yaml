# Memini with its database: the supported install. Needs Docker Compose 2.24.0 or later.
#
#   docker compose up                 # build the image, start the database and the service
#   docker compose up -d --wait       # the same in the background; returns once both are healthy
#   docker compose up -d --wait db    # the database alone, for development and tests (or: make db)
#
# Both services publish their port on the host's 127.0.0.1 only, so other machines cannot reach
# them. Inside its container the service listens on 0.0.0.0 (set in the image): that is the
# container's own network interface, which the host reaches through the published port. To let
# other machines reach Memini, change the published address here, and put TLS in front of it.
#
# Configuration lives in three places, none of them required (docs/configuration.md, "Docker
# compose"):
#
# - `.env` next to this file (.env.example): what compose itself reads on the host. The ports
#   published on the host (MEMINI_HTTP_PORT, default 6364, MCP at http://127.0.0.1:6364/mcp;
#   MEMINI_DB_PORT, default 55432), the database password (MEMINI_DB_PASSWORD, default memini:
#   letters and digits only, set before the first start, as the database keeps the password it was
#   created with), where the settings file is (MEMINI_ENV_FILE), and the paths of the files that
#   hold secrets (MEMINI_CREDENTIAL_KEY_FILE and the others under `secrets` below).
# - `.env.memini` (.env.memini.example): the settings of the service, one MEMINI_NAME=value per
#   line, passed into the container as they are. Embeddings, git, search, ingest, retention, LLM
#   providers, logging: every setting but the few compose sets itself (below). Its values show in
#   `docker inspect`, so no secret goes there.
# - Secret files, mounted read-only into the container and read by the service through
#   MEMINI_*_FILE: their values never show in `docker inspect`.
#
# After a change, `docker compose up -d` recreates the service. A secret file whose content
# changed is not noticed that way: `docker compose up -d --force-recreate memini`.
#
# Data lives in named volumes: `memini-db` (the database) and `memini-mirrors` (the bare mirrors
# of git sources, which can be re-cloned). `docker compose down` keeps them; only
# `docker compose down --volumes` deletes them.

name: memini

services:
  db:
    # Pinned by version and by the digest of its multi-platform index (amd64 and arm64); update
    # both together, and the same image in .github/workflows/ci.yml.
    image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_USER: memini
      POSTGRES_PASSWORD: ${MEMINI_DB_PASSWORD:-memini}
      POSTGRES_DB: memini
    ports:
      - "127.0.0.1:${MEMINI_DB_PORT:-55432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - memini-db:/var/lib/postgresql
    healthcheck:
      # Over TCP: on first start the image runs a temporary server that listens on the socket only
      # while it initialises; checking the socket would report healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U memini -d memini"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  memini:
    build:
      context: .
    # The image is built from this checkout on every `up`, so it always matches the code; the
    # layer cache makes an unchanged rebuild take seconds. Never pulled from a registry.
    image: memini:dev
    pull_policy: build
    # The first start applies the migrations; later starts find none pending.
    command: ["serve", "--migrate"]
    # The settings of the service (.env.memini.example), from .env.memini next to this file or the
    # file MEMINI_ENV_FILE names. Optional: without it, the service's defaults apply, and with them
    # no embeddings. Every line reaches the service as it is, so a new setting needs no change
    # here. (`required: false` needs Docker Compose 2.24.0.)
    env_file:
      - path: ${MEMINI_ENV_FILE:-.env.memini}
        required: false
    environment:
      # Set here, over a line of the settings file: the database of this stack, and what the image
      # sets as well. In .env, MEMINI_HTTP_PORT is the port on the host; inside the container the
      # service listens on 6364, on every interface of the container, and keeps its mirrors on the
      # volume below.
      MEMINI_DATABASE_URL: postgresql://memini:${MEMINI_DB_PASSWORD:-memini}@db:5432/memini
      MEMINI_HTTP_HOST: 0.0.0.0
      MEMINI_HTTP_PORT: "6364"
      MEMINI_GIT_MIRROR_DIR: /var/lib/memini/mirrors
      # Secrets and other files (`secrets` below): set to the file's path in the container when
      # its path on the host is set in .env, and empty, which counts as not set, when it is not.
      MEMINI_CREDENTIAL_KEY_FILE: ${MEMINI_CREDENTIAL_KEY_FILE:+/run/secrets/credential_key}
      MEMINI_CREDENTIAL_OLD_KEYS_FILE: ${MEMINI_CREDENTIAL_OLD_KEYS_FILE:+/run/secrets/credential_old_keys}
      MEMINI_GIT_HTTPS_TOKEN_FILE: ${MEMINI_GIT_HTTPS_TOKEN_FILE:+/run/secrets/git_https_token}
      MEMINI_GIT_SSH_KEY_PATH: ${MEMINI_GIT_SSH_KEY_PATH:+/run/secrets/git_ssh_key}
      MEMINI_GIT_SSH_KNOWN_HOSTS_PATH: ${MEMINI_GIT_SSH_KNOWN_HOSTS_PATH:+/run/secrets/git_ssh_known_hosts}
      MEMINI_EMBEDDING_API_KEY_FILE: ${MEMINI_EMBEDDING_API_KEY_FILE:+/run/secrets/embedding_api_key}
      MEMINI_LLM_LOCAL_API_KEY_FILE: ${MEMINI_LLM_LOCAL_API_KEY_FILE:+/run/secrets/llm_local_api_key}
      MEMINI_LLM_CLOUD_API_KEY_FILE: ${MEMINI_LLM_CLOUD_API_KEY_FILE:+/run/secrets/llm_cloud_api_key}
      MEMINI_METRICS_TOKEN_FILE: ${MEMINI_METRICS_TOKEN_FILE:+/run/secrets/metrics_token}
    # Each at /run/secrets/<name>, read-only.
    secrets:
      - credential_key
      - credential_old_keys
      - git_https_token
      - git_ssh_key
      - git_ssh_known_hosts
      - embedding_api_key
      - llm_local_api_key
      - llm_cloud_api_key
      - metrics_token
    # host.docker.internal is the host: Docker Desktop and OrbStack define it, and on Linux this
    # entry maps it to the host's address on the Docker bridge. Ollama on Linux listens on
    # 127.0.0.1 only by default; see .env.memini.example for making it reachable from the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host side: 127.0.0.1 only. Container side: the port the image listens on.
      - "127.0.0.1:${MEMINI_HTTP_PORT:-6364}:6364"
    depends_on:
      db:
        condition: service_healthy
    # The healthcheck comes from the image: healthy once /readyz answers 200 (database reachable).
    restart: unless-stopped
    # A small init as PID 1 forwards signals and reaps child processes.
    init: true
    # On stop: open requests get 10 s, a running job 30 s, recording its end 10 s more. Docker's
    # default of 10 s before SIGKILL would cut that short.
    stop_grace_period: 60s
    # The service writes nothing to its own filesystem, only to the mirror volume.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # The bare mirrors of git sources (MEMINI_GIT_MIRROR_DIR), owned by the service user.
      - memini-mirrors:/var/lib/memini/mirrors
      # Local repositories as sources: mount the directory that holds them, read-only (the service
      # only clones from them), and list its path in the container in MEMINI_GIT_LOCAL_ROOTS in
      # .env.memini; a source then names a repository by that path, e.g. /srv/repos/app. On Linux
      # the files must be readable by the service user, uid 10001. For example, with
      # MEMINI_GIT_LOCAL_ROOTS=/srv/repos:
      # - /home/me/src:/srv/repos:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Docker keeps container logs without a limit by default; keep at most 3 files of 10 MB.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# The secret files of the service: each one's path on the host comes from .env (.env.example), and
# relative paths start at this directory; secrets/ is ignored by git for them. The service runs as
# uid 10001 and reads them: on Linux a file keeps its owner and mode in the container, so make it
# readable by that user (`sudo chown 10001 FILE`, mode 400); Docker Desktop and OrbStack let the
# container's user read it. A secret that is not set gets secrets/unset, an empty file the service
# does not read.
secrets:
  credential_key:
    file: ${MEMINI_CREDENTIAL_KEY_FILE:-./secrets/unset}
  credential_old_keys:
    file: ${MEMINI_CREDENTIAL_OLD_KEYS_FILE:-./secrets/unset}
  git_https_token:
    file: ${MEMINI_GIT_HTTPS_TOKEN_FILE:-./secrets/unset}
  git_ssh_key:
    file: ${MEMINI_GIT_SSH_KEY_PATH:-./secrets/unset}
  git_ssh_known_hosts:
    file: ${MEMINI_GIT_SSH_KNOWN_HOSTS_PATH:-./secrets/unset}
  embedding_api_key:
    file: ${MEMINI_EMBEDDING_API_KEY_FILE:-./secrets/unset}
  llm_local_api_key:
    file: ${MEMINI_LLM_LOCAL_API_KEY_FILE:-./secrets/unset}
  llm_cloud_api_key:
    file: ${MEMINI_LLM_CLOUD_API_KEY_FILE:-./secrets/unset}
  metrics_token:
    file: ${MEMINI_METRICS_TOKEN_FILE:-./secrets/unset}

volumes:
  memini-db:
  memini-mirrors:
