# Memini with its database: the supported install.
#
#   docker compose up                 # build the image, start the database and the service
#   docker compose up -d --wait       # the same in the background; returns once both are healthy
#   docker compose up -d --wait db    # the database alone, for development and tests (or: make db)
#
# Both services publish their port on the host's 127.0.0.1 only, so other machines cannot reach
# them. Inside its container the service listens on 0.0.0.0 (set in the image): that is the
# container's own network interface, which the host reaches through the published port. To let
# other machines reach Memini, change the published address here, and put TLS in front of it.
#
# Settings, from the environment or a `.env` file next to this one:
#
# - MEMINI_HTTP_PORT: host port of the service (default 6364; MCP at http://127.0.0.1:6364/mcp).
# - MEMINI_DB_PORT: host port of the database (default 55432, to stay clear of a local Postgres on
#   5432).
# - MEMINI_DB_PASSWORD: password of the database role (default: memini, a development default).
#   Use letters and digits: it goes into the service's database URL as is. For more than a local
#   machine, set a strong one before the first start: the database keeps the password it was
#   created with.
# - MEMINI_LOG_LEVEL: CRITICAL, ERROR, WARNING, INFO (default) or DEBUG.
# - MEMINI_EMBEDDING_*: embeddings, off unless MEMINI_EMBEDDING_PROVIDER is set. With
#   MEMINI_EMBEDDING_PROVIDER=openai_compatible and nothing else, the service embeds with
#   Qwen3-Embedding 0.6B (qwen3-embedding:0.6b) from Ollama on the host, at
#   http://host.docker.internal:11434/v1. Without embeddings the service starts and serves, but it
#   does not sync git sources, and search answers that no embedding provider is configured. See
#   .env.example.
#
# Data lives in named volumes: `memini-db` (the database) and `memini-mirrors` (the bare mirrors
# of git sources, which can be re-cloned). `docker compose down` keeps them; only
# `docker compose down --volumes` deletes them.

name: memini

services:
  db:
    # Pinned by version and by the digest of its multi-platform index (amd64 and arm64); update
    # both together, and the same image in .github/workflows/ci.yml.
    image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_USER: memini
      POSTGRES_PASSWORD: ${MEMINI_DB_PASSWORD:-memini}
      POSTGRES_DB: memini
    ports:
      - "127.0.0.1:${MEMINI_DB_PORT:-55432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - memini-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memini -d memini"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  memini:
    build:
      context: .
    # The image is built from this checkout on every `up`, so it always matches the code; the
    # layer cache makes an unchanged rebuild take seconds. Never pulled from a registry.
    image: memini:dev
    pull_policy: build
    # The first start applies the migrations; later starts find none pending.
    command: ["serve", "--migrate"]
    environment:
      MEMINI_DATABASE_URL: postgresql://memini:${MEMINI_DB_PASSWORD:-memini}@db:5432/memini
      MEMINI_LOG_LEVEL: ${MEMINI_LOG_LEVEL:-INFO}
      # Embeddings (.env.example). A variable left empty counts as not set, so the defaults of
      # the service apply (src/memini/config.py): the model qwen3-embedding:0.6b, its dimension,
      # digest and query instruction. Only the URL differs from the service's default: inside
      # the container, 127.0.0.1 is the container itself, so it points at Ollama on the host
      # when a provider is set, and stays empty (no embedding setting at all) when none is.
      # The image has no in-process model: openai_compatible is the provider to use here.
      MEMINI_EMBEDDING_PROVIDER: ${MEMINI_EMBEDDING_PROVIDER:-}
      MEMINI_EMBEDDING_URL: ${MEMINI_EMBEDDING_URL:-${MEMINI_EMBEDDING_PROVIDER:+http://host.docker.internal:11434/v1}}
      MEMINI_EMBEDDING_MODEL: ${MEMINI_EMBEDDING_MODEL:-}
      MEMINI_EMBEDDING_DIMENSION: ${MEMINI_EMBEDDING_DIMENSION:-}
      MEMINI_EMBEDDING_DIGEST: ${MEMINI_EMBEDDING_DIGEST:-}
      MEMINI_EMBEDDING_QUERY_PREFIX: ${MEMINI_EMBEDDING_QUERY_PREFIX:-}
      MEMINI_EMBEDDING_DOCUMENT_PREFIX: ${MEMINI_EMBEDDING_DOCUMENT_PREFIX:-}
      MEMINI_EMBEDDING_BATCH_SIZE: ${MEMINI_EMBEDDING_BATCH_SIZE:-}
      MEMINI_EMBEDDING_TIMEOUT: ${MEMINI_EMBEDDING_TIMEOUT:-}
    # host.docker.internal is the host: Docker Desktop and OrbStack define it, and on Linux this
    # entry maps it to the host's address on the Docker bridge. Ollama on Linux listens on
    # 127.0.0.1 only by default; see .env.example for making it reachable from the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host side: 127.0.0.1 only. Container side: the port the image listens on.
      - "127.0.0.1:${MEMINI_HTTP_PORT:-6364}:6364"
    depends_on:
      db:
        condition: service_healthy
    # The healthcheck comes from the image: healthy once /readyz answers 200 (database reachable).
    restart: unless-stopped
    # A small init as PID 1 forwards signals and reaps child processes.
    init: true
    # On stop: open requests get 10 s, a running job 30 s, recording its end 10 s more. Docker's
    # default of 10 s before SIGKILL would cut that short.
    stop_grace_period: 60s
    # The service writes nothing to its own filesystem, only to the mirror volume.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # The bare mirrors of git sources (MEMINI_GIT_MIRROR_DIR in the image), owned by the service
      # user. A local repository becomes a source only if it is mounted into the container too, and
      # its directory is listed in MEMINI_GIT_LOCAL_ROOTS.
      - memini-mirrors:/var/lib/memini/mirrors
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Docker keeps container logs without a limit by default; keep at most 3 files of 10 MB.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  memini-db:
  memini-mirrors:
